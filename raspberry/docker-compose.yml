services:
  mosquitto:
    build: ./mqtt
    container_name: nodealert-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/data:/mosquitto/data
    environment:
      - MQTT_NODERED_PASS=${MQTT_NODERED_PASS:?Falta MQTT_NODERED_PASS en raspberry/.env (copiar .env.example)}
      - MQTT_ESP32_PASS=${MQTT_ESP32_PASS:?Falta MQTT_ESP32_PASS en raspberry/.env (copiar .env.example)}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nodealert-net
    restart: unless-stopped
  nodered:
    build: ./nodered
    container_name: nodealert-nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - MQTT_NODERED_PASS=${MQTT_NODERED_PASS:?Falta MQTT_NODERED_PASS en raspberry/.env (copiar .env.example)}
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - nodealert-net
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: nodealert-frontend
    ports:
      - "3001:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      nodered:
        condition: service_started
    networks:
      - nodealert-net
    restart: unless-stopped
networks:
  nodealert-net:
    driver: bridge
